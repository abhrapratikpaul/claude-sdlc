<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Document Upload</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <h1>PDF Document Upload</h1>

        <div class="upload-section">
            <!-- Hidden file input -->
            <input
                type="file"
                id="fileInput"
                accept=".pdf"
                hidden
                aria-label="Select PDF file"
            >

            <!-- Visible select file button -->
            <button
                id="selectFileBtn"
                type="button"
                class="btn btn-primary"
            >
                Choose PDF File
            </button>

            <!-- Selected filename display -->
            <div id="selectedFileName" class="filename-display" role="status" aria-live="polite"></div>

            <!-- Upload button -->
            <button
                id="uploadBtn"
                type="button"
                class="btn btn-success"
                disabled
            >
                Upload File
            </button>
        </div>

        <!-- Progress tracking -->
        <div id="progressContainer" class="progress-container" hidden>
            <progress id="progressBar" value="0" max="100" aria-label="Upload progress"></progress>
            <span id="progressText" class="progress-text">0%</span>
        </div>

        <!-- Message area for success/error messages -->
        <div id="messageArea" class="message-area" role="alert" aria-live="assertive"></div>

        <!-- Retry button (shown on error) -->
        <button
            id="retryBtn"
            type="button"
            class="btn btn-retry"
            hidden
        >
            Retry Upload
        </button>
    </main>

    <script src="upload.js"></script>
</body>
</html>
